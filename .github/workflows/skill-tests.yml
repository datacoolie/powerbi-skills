name: skill-tests

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skill-tests.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".github/workflows/skill-tests.yml"

jobs:
  offline-gate:
    name: Offline gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile skill scripts
        run: >-
          python -m compileall
          skills/power-bi-management/scripts
          skills/power-bi-report-design/scripts
          skills/power-bi-report-authoring/scripts
          scripts

      - name: Install pytest
        run: python -m pip install pytest

      - name: Management unit tests
        run: >-
          python -m unittest discover
          -s skills/power-bi-management/scripts/tests
          -p "test_*.py" -v

      - name: Design script tests (visual contract, layout rescale)
        run: python -m pytest skills/power-bi-report-design/scripts/tests -q

      - name: Visual-type contract check
        run: python skills/power-bi-report-design/scripts/check_visual_type_contract.py
