name: repo-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The CLI-dependent tests (scaffold, validate, generator, drift gate) skip when it is missing;
      # install it so CI exercises them.
      - name: Install Power BI report authoring CLI
        run: npm install -g @microsoft/powerbi-report-authoring-cli@latest

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Repo checks (mirror integrity, skill lint, tests)
        run: python scripts/check_repo.py
